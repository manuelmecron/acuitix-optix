<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AcuiScan V1 - Workflow Séquentiel</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; color: #fff; }

        .view { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; justify-content: center; align-items: center; }
        .view.active { display: flex; }

        #orientation-warning {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #111; z-index: 9999;
            display: none; justify-content: center; align-items: center; text-align: center; padding: 20px; font-size: 1.2rem;
        }
        @media screen and (orientation: portrait) {
            #orientation-warning { display: flex; }
        }

        #camera-container { position: relative; width: 100%; height: 100%; background: #000; overflow: hidden; }
        #webcam { width: 100%; height: 100%; object-fit: cover; }
        
        .red-axis-line {
            position: absolute; top: 50%; left: 0; width: 100%; height: 2px; background: red; transform: translateY(-50%); pointer-events: none; z-index: 10; display: none;
        }
        .red-axis-line.active { display: block; }

        #status-hud {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85); padding: 10px 20px; border-radius: 25px;
            font-size: 0.95rem; color: #ffeb3b; z-index: 25; border: 2px solid #ffeb3b; text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); max-width: 90%;
        }

        .preview-canvas { max-width: 85%; max-height: 65vh; object-fit: contain; border: 2px solid #444; border-radius: 4px; }
        .toolbar { margin-top: 15px; display: flex; gap: 15px; z-index: 30; flex-wrap: wrap; justify-content: center; }
        .btn { padding: 12px 22px; font-size: 0.95rem; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; text-decoration: none; display: inline-block; text-align: center; }
        .btn-primary { background: #4CAF50; color: white; }
        .btn-secondary { background: #f44336; color: white; }
        .btn-blue { background: #2196F3; color: white; }
        .btn-dark { background: #333; color: white; border: 1px solid #555; }
    </style>
</head>
<body>

    <div id="orientation-warning">Veuillez tourner votre appareil en mode paysage pour utiliser AcuiScan V1.</div>

    <!-- VUE 1 : Caméra et Séquencement intelligent -->
    <div id="view-camera" class="view active">
        <div id="camera-container">
            <video id="webcam" autoplay playsinline muted></video>
            <div id="status-hud" style="color: #ffeb3b;">Initialisation de la caméra...</div>
            <div id="axis-line" class="red-axis-line"></div>
        </div>
    </div>

    <!-- VUE 2 : Validation avec Cadre Jaune -->
    <div id="view-review" class="view" style="background: #121212;">
        <canvas id="review-canvas" class="preview-canvas"></canvas>
        <div class="toolbar">
            <button class="btn btn-secondary" onclick="resetApp()">Recommencer</button>
            <button class="btn btn-primary" onclick="validatePhoto()">Validé</button>
        </div>
    </div>

    <!-- VUE 3 : Options d'Export -->
    <div id="view-export" class="view" style="background: #121212; padding: 20px; text-align: center;">
        <h2>Exportation - ETALON11NW</h2>
        <p id="precision-text" style="margin: 8px 0; color: #4CAF50; font-size: 0.95rem;"></p>
        <p style="margin-bottom: 15px; color: #aaa; font-size: 0.85rem;">Téléchargez vos fichiers ci-dessous :</p>
        
        <div class="toolbar" style="flex-direction: column; gap: 10px; align-items: center;">
            <a id="dl-traced" class="btn btn-blue" download="AcuiScan_Traume_Superpose.png">📥 Télécharger Photo Tracée (avec cadre & axe)</a>
            <a id="dl-original" class="btn btn-dark" download="AcuiScan_Originale.png">📥 Télécharger Photo Originale</a>
            <a id="dl-json" class="btn btn-dark" download="AcuiScan_Coordonnees.json">📥 Télécharger Fichier JSON (Coordonnées CAO)</a>
        </div>

        <div class="toolbar" style="margin-top: 25px;">
            <button class="btn btn-secondary" onclick="resetApp()">Reprendre une photo</button>
        </div>
    </div>

    <canvas id="hidden-canvas" style="display:none;"></canvas>

    <script src="https://cdn.jsdelivr.net/gh/jcmellado/js-aruco@master/src/cv.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/jcmellado/js-aruco@master/src/aruco.js"></script>

    <script>
        const video = document.getElementById('webcam');
        const hiddenCanvas = document.getElementById('hidden-canvas');
        const hiddenCtx = hiddenCanvas.getContext('2d', { willReadFrequently: true });
        const reviewCanvas = document.getElementById('review-canvas');
        const reviewCtx = reviewCanvas.getContext('2d');
        const statusHud = document.getElementById('status-hud');
        const axisLine = document.getElementById('axis-line');

        const ETALON_WIDTH_MM = 170.0;
        const ETALON_HEIGHT_MM = 100.0;

        let currentStage = 0; // 0: ID 0, 1: ID 1, 2: ID 3, 3: ID 2, 4: Overview
        let capturedMarkers = {};
        let stabilityCounter = 0;
        let detectionInterval = null;
        let originalSnapshotUrl = "";

        const stageConfig = [
            { id: 0, name: "Marqueur 0 (Haut-Gauche)" },
            { id: 1, name: "Marqueur 1 (Haut-Droite)" },
            { id: 3, name: "Marqueur 3 (Bas-Droite)" },
            { id: 2, name: "Marqueur 2 (Bas-Gauche)" }
        ];

        async function initCamera() {
            try {
                const constraints = {
                    video: {
                        facingMode: "environment",
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    }
                };
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                
                if (screen.orientation && screen.orientation.lock) {
                    screen.orientation.lock('landscape').catch(() => {});
                }

                video.onloadedmetadata = () => {
                    video.play();
                    startEngine();
                };
            } catch (err) {
                console.error("Erreur caméra :", err);
                statusHud.innerText = "Erreur d'accès à la caméra arrière.";
            }
        }

        function getMarkerCenter(corners) {
            let x = (corners[0].x + corners[1].x + corners[2].x + corners[3].x) / 4;
            let y = (corners[0].y + corners[1].y + corners[2].y + corners[3].y) / 4;
            return { x, y };
        }

        function startEngine() {
            if (detectionInterval) clearInterval(detectionInterval);

            detectionInterval = setInterval(() => {
                if (video.paused || video.ended || !video.videoWidth) return;

                hiddenCanvas.width = video.videoWidth;
                hiddenCanvas.height = video.videoHeight;
                hiddenCtx.drawImage(video, 0, 0, hiddenCanvas.width, hiddenCanvas.height);

                let imageData = hiddenCtx.getImageData(0, 0, hiddenCanvas.width, hiddenCanvas.height);
                
                try {
                    let detector = new AR.Detector();
                    let markers = detector.detect(imageData);

                    if (currentStage < 4) {
                        // ETAPES 1 à 4 : Capture de près un par un
                        let targetId = stageConfig[currentStage].id;
                        let targetName = stageConfig[currentStage].name;
                        let found = markers.find(m => m.id === targetId);

                        if (found) {
                            stabilityCounter++;
                            statusHud.innerText = `✅ ${targetName} détecté (${stabilityCounter}/3)`;
                            statusHud.style.color = "#4CAF50";

                            if (stabilityCounter >= 3) {
                                capturedMarkers[targetId] = getMarkerCenter(found.corners);
                                currentStage++;
                                stabilityCounter = 0;

                                if (currentStage < 4) {
                                    statusHud.innerText = `🎯 Parfait ! Visez maintenant le ${stageConfig[currentStage].name}`;
                                    statusHud.style.color = "#ffeb3b";
                                } else {
                                    // Passage à la vue d'ensemble
                                    axisLine.classList.add('active');
                                    statusHud.innerText = "🎉 4/4 repérés ! Écartez la vue pour la photo globale...";
                                    statusHud.style.color = "#2196F3";
                                }
                            }
                        } else {
                            stabilityCounter = 0;
                            statusHud.innerText = `🔍 Rapprochez-vous du ${targetName}...`;
                            statusHud.style.color = "#ffeb3b";
                        }
                    } else {
                        // ETAPE 5 : Vue d'ensemble - Vérification des 4 marqueurs simultanément
                        let detectedCount = 0;
                        let currentFound = {};
                        markers.forEach(m => {
                            if ([0, 1, 2, 3].includes(m.id)) {
                                currentFound[m.id] = getMarkerCenter(m.corners);
                                detectedCount++;
                            }
                        });

                        if (detectedCount === 4) {
                            stabilityCounter++;
                            statusHud.innerText = `📸 Vue d'ensemble stable (${stabilityCounter}/4) - Capture...`;
                            statusHud.style.color = "#4CAF50";

                            if (stabilityCounter >= 4) {
                                clearInterval(detectionInterval);
                                finalizeOverviewCapture(currentFound);
                            }
                        } else {
                            stabilityCounter = 0;
                            statusHud.innerText = `📐 Reculez et alignez l'axe rouge (${detectedCount}/4 visibles)`;
                            statusHud.style.color = "#ffeb3b";
                        }
                    }
                } catch (e) {
                    // Ignore les erreurs de frame isolées
                }
            }, 250);
        }

        function finalizeOverviewCapture(detectedMap) {
            originalSnapshotUrl = hiddenCanvas.toDataURL('image/png');

            let c0 = detectedMap[0];
            let c1 = detectedMap[1];
            let c2 = detectedMap[2];
            let c3 = detectedMap[3];

            let pixelWidth = Math.hypot(c1.x - c0.x, c1.y - c0.y);
            let pixelHeight = Math.hypot(c2.y - c0.y, c2.x - c0.x);
            let ratioX = ETALON_WIDTH_MM / pixelWidth;
            let ratioY = ETALON_HEIGHT_MM / pixelHeight;
            let precisionFactor = Number(((ratioX + ratioY) / 2).toFixed(4));

            reviewCanvas.width = hiddenCanvas.width;
            reviewCanvas.height = hiddenCanvas.height;
            reviewCtx.drawImage(hiddenCanvas, 0, 0);

            // Tracé du cadre jaune
            reviewCtx.strokeStyle = "#FFEB3B";
            reviewCtx.lineWidth = 5;
            reviewCtx.beginPath();
            reviewCtx.moveTo(c0.x, c0.y);
            reviewCtx.lineTo(c1.x, c1.y);
            reviewCtx.lineTo(c3.x, c3.y);
            reviewCtx.lineTo(c2.x, c2.y);
            reviewCtx.closePath();
            reviewCtx.stroke();

            // Tracé de l'axe rouge horizontal
            reviewCtx.strokeStyle = "#F44336";
            reviewCtx.lineWidth = 3;
            reviewCtx.beginPath();
            reviewCtx.moveTo(0, reviewCanvas.height / 2);
            reviewCtx.lineTo(reviewCanvas.width, reviewCanvas.height / 2);
            reviewCtx.stroke();

            let processedDataUrl = reviewCanvas.toDataURL('image/png');

            let exportJSON = {
                template: "ETALON11NW",
                dimensions_mm: { width: ETALON_WIDTH_MM, height: ETALON_HEIGHT_MM },
                calibration_precision_mm_per_pixel: precisionFactor,
                marqueurs_centres_pixels: {
                    "0_haut_gauche": c0,
                    "1_haut_droit": c1,
                    "2_bas_gauche": c2,
                    "3_bas_droit": c3
                },
                timestamp: new Date().toISOString()
            };

            document.getElementById('dl-traced').href = processedDataUrl;
            document.getElementById('dl-original').href = originalSnapshotUrl;
            document.getElementById('dl-json').href = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportJSON, null, 4));
            document.getElementById('precision-text').innerText = `Étalonnage validé (Précision : ${precisionFactor} mm/pixel)`;

            switchView('view-review');
        }

        function validatePhoto() {
            switchView('view-export');
        }

        function resetApp() {
            currentStage = 0;
            capturedMarkers = {};
            stabilityCounter = 0;
            axisLine.classList.remove('active');
            statusHud.innerText = `🔍 Rapprochez-vous du ${stageConfig[0].name}`;
            statusHud.style.color = "#ffeb3b";
            switchView('view-camera');
            startEngine();
        }

        function switchView(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
        }

        window.addEventListener('load', initCamera);
    </script>
</body>
</html>
