<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Acuitix Optix - Calibration Étalon 11 & JSON</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; touch-action: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }

        #app-container { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        #videoInput { display: none; }
        #canvasOutput { width: 100%; height: 100%; display: block; }

        .ui-btn {
            position: absolute; bottom: 20px; background: #28a745; color: white; border: none;
            padding: 14px 22px; border-radius: 30px; font-size: 15px; font-weight: bold;
            cursor: pointer; z-index: 20; box-shadow: 0 4px 10px rgba(0,0,0,0.6); touch-action: auto;
        }
        #btn-action { left: 50%; transform: translateX(-50%); }
        #btn-left { left: 20px; display: none; }
        #btn-right { right: 20px; display: none; }

        #status-msg {
            position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.85); color: yellow; padding: 6px 14px;
            border-radius: 15px; font-size: 13px; z-index: 25; font-family: monospace; text-align: center;
        }

        #control-panel {
            position: absolute; bottom: 80px; width: 100%; display: none;
            justify-content: center; gap: 15px; align-items: center; padding: 0 10px; z-index: 25; pointer-events: none;
        }
        .interactive-ui { pointer-events: auto; touch-action: auto; }

        .central-marker {
            position: absolute; width: 50px; height: 50px; border: 2px dashed #ff00ff;
            background: rgba(255, 235, 59, 0.4); color: black; font-weight: bold; font-size: 11px;
            display: none; align-items: center; justify-content: center;
            cursor: pointer; z-index: 26; box-shadow: 0 2px 6px rgba(0,0,0,0.5); user-select: none;
            touch-action: none; border-radius: 4px;
        }
        #marker-left { background: rgba(255, 235, 59, 0.7); }
        #marker-right { background: rgba(255, 235, 59, 0.7); }

        .tools-group { display: flex; gap: 10px; }
        .tool-btn {
            background: rgba(30,30,30,0.9); color: white; border: 1px solid #777;
            padding: 10px 14px; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.4); touch-action: auto;
        }

        #landscape-warning {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95); color: white; z-index: 2000;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 20px; font-size: 20px;
        }

        #preview-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92); z-index: 3000; display: none;
            flex-direction: column; align-items: center; justify-content: center; padding: 10px;
        }
        #preview-canvas { max-width: 90vw; max-height: 65vh; border: 2px solid white; object-fit: contain; }
        .modal-actions { margin-top: 15px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .modal-actions button {
            padding: 10px 16px; background: #007bff; color: white; border: none; border-radius: 6px;
            font-size: 14px; cursor: pointer; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.4); touch-action: auto;
        }
        .modal-actions button.secondary { background: #6c757d; }
    </style>
</head>
<body>

    <div id="landscape-warning">
        📱<br><br><b>Veuillez tourner votre téléphone en mode paysage</b>
    </div>

    <div id="status-msg">Étape 1 : Prenez la photo martyr alignée sur l'axe X</div>

    <div class="central-marker" id="marker-left">C-G</div>
    <div class="central-marker" id="marker-right">C-D</div>

    <div id="control-panel">
        <div class="tools-group interactive-ui">
            <button class="tool-btn" id="zoom-plus">🔍 Zoom +</button>
            <button class="tool-btn" id="zoom-minus">🔍 Zoom -</button>
            <button class="tool-btn" id="reset-view" style="background: #555;">🔄 Centrer</button>
        </div>
    </div>

    <div id="preview-modal">
        <canvas id="preview-canvas"></canvas>
        <div class="modal-actions">
            <button id="dl-with-layers">💾 Télécharger avec calques</button>
            <button id="dl-original" class="secondary">📥 Télécharger originale</button>
            <button id="dl-json" style="background: #17a2b8;">📋 Télécharger JSON</button>
            <button id="close-preview" style="background: #dc3545;">❌ Fermer</button>
        </div>
    </div>

    <div id="app-container">
        <video id="videoInput" autoplay playsinline muted></video>
        <canvas id="canvasOutput"></canvas>
        
        <button class="ui-btn" id="btn-action">📸 Prendre la Photo Martyr</button>
        <button class="ui-btn" id="btn-left">📸 Capturer</button>
        <button class="ui-btn" id="btn-right">📸 Capturer</button>
    </div>

    <script>
        // --- COTES OFFICIELLES DE L'ÉTALON 11 ---
        // Modifiez ces multiplicateurs ou valeurs fixes selon les dimensions exactes de votre plan
        const ETALON_SPECS = {
            widthRatioFromCenters: 1.6, // Rapport entre la largeur totale de l'étalon et l'entraxe mesuré C_G / C_D
            heightRatioFromCenters: 0.9 // Rapport de hauteur totale par rapport à l'entraxe
        };

        let video = document.getElementById('videoInput');
        let canvas = document.getElementById('canvasOutput');
        let ctx = canvas.getContext('2d');
        let statusMsg = document.getElementById('status-msg');
        let btnAction = document.getElementById('btn-action');
        let btnLeft = document.getElementById('btn-left');
        let btnRight = document.getElementById('btn-right');
        let controlPanel = document.getElementById('control-panel');
        let warningScreen = document.getElementById('landscape-warning');

        let previewModal = document.getElementById('preview-modal');
        let previewCanvas = document.getElementById('preview-canvas');

        let appState = 'CAPTURE_MARTYR'; 
        let martyrImage = null;
        let streaming = false;

        let calibrationConfig = {
            specs: ETALON_SPECS,
            centerLeft: { x: 0, y: 0 },
            centerRight: { x: 0, y: 0 },
            corners: [] 
        };

        let zoomLevel = 1.0;
        let panX = 0;
        let panY = 0;

        function checkOrientation() {
            if (window.innerHeight > window.innerWidth) {
                warningScreen.style.display = 'flex';
            } else {
                warningScreen.style.display = 'none';
            }
        }
        window.addEventListener('resize', checkOrientation);
        window.addEventListener('orientationchange', checkOrientation);
        checkOrientation();

        function resizeCanvasToDisplay() {
            let displayWidth = window.innerWidth;
            let displayHeight = window.innerHeight;
            if (canvas.width !== displayWidth || canvas.height !== displayHeight) {
                canvas.width = displayWidth;
                canvas.height = displayHeight;
            }
        }

        function initDefaultMarkers(w, h) {
            let saved = localStorage.getItem('acuitix_etalon11_json');
            if (saved) {
                try {
                    let parsed = JSON.parse(saved);
                    if (parsed && parsed.centerLeft && parsed.centerRight) {
                        calibrationConfig = parsed;
                        return;
                    }
                } catch(e) { console.error("Erreur lecture JSON"); }
            }

            let cy = h / 2;
            calibrationConfig.centerLeft = { x: w * 0.35, y: cy };
            calibrationConfig.centerRight = { x: w * 0.65, y: cy };
            updateCornersFromCenters();
        }

        function updateCornersFromCenters() {
            let cl = calibrationConfig.centerLeft;
            let cr = calibrationConfig.centerRight;
            
            let dx = cr.x - cl.x;
            let dy = cr.y - cl.y;
            let distance = Math.sqrt(dx * dx + dy * dy);
            let angle = Math.atan2(dy, dx);

            // Application rigoureuse des cotes de l'Étalon 11
            let frameWidth = distance * ETALON_SPECS.widthRatioFromCenters; 
            let frameHeight = distance * ETALON_SPECS.heightRatioFromCenters; 

            let cx = (cl.x + cr.x) / 2;
            let cy = (cl.y + cr.y) / 2;

            let cos = Math.cos(angle);
            let sin = Math.sin(angle);
            let hw = frameWidth / 2;
            let hh = frameHeight / 2;

            function rot(localX, localY) {
                return {
                    x: cx + (localX * cos - localY * sin),
                    y: cy + (localX * sin + localY * cos)
                };
            }

            calibrationConfig.corners = [
                rot(-hw, -hh), // SG
                rot(hw, -hh),  // SD
                rot(hw, hh),   // ID
                rot(-hw, hh)   // IG
            ];
        }

        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })
            .then(stream => {
                video.srcObject = stream;
                video.play();
                streaming = true;
                initDefaultMarkers(window.innerWidth, window.innerHeight);
                requestAnimationFrame(mainLoop);
            })
            .catch(err => alert("Erreur caméra : " + err.message));

        function drawCover(source) {
            let cw = canvas.width;
            let ch = canvas.height;
            let sw = source.videoWidth || source.width;
            let sh = source.videoHeight || source.height;
            if (!sw || !sh) return;

            let hRatio = cw / sw;
            let vRatio = ch / sh;
            let ratio = Math.max(hRatio, vRatio);
            let centerShiftX = (cw - sw * ratio) / 2;
            let centerShiftY = (ch - sh * ratio) / 2;

            ctx.drawImage(source, 0, 0, sw, sh, centerShiftX, centerShiftY, sw * ratio, sh * ratio);
        }

        function updateMarkersDOM() {
            if (appState !== 'ADJUST_MARTYR') {
                document.getElementById('marker-left').style.display = 'none';
                document.getElementById('marker-right').style.display = 'none';
                return;
            }

            ['Left', 'Right'].forEach(side => {
                let pt = calibrationConfig['center' + side];
                let screenX = (pt.x - canvas.width / 2) * zoomLevel + canvas.width / 2 + panX;
                let screenY = (pt.y - canvas.height / 2) * zoomLevel + canvas.height / 2 + panY;
                
                let el = document.getElementById('marker-' + side.toLowerCase());
                if (el) {
                    el.style.display = 'flex';
                    el.style.left = (screenX - 25) + 'px';
                    el.style.top = (screenY - 25) + 'px';
                }
            });
        }

        function mainLoop() {
            if (!streaming) return;
            resizeCanvasToDisplay();

            if (video.readyState >= video.HAVE_CURRENT_DATA) {
                ctx.save();
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                ctx.translate(canvas.width / 2 + panX, canvas.height / 2 + panY);
                ctx.scale(zoomLevel, zoomLevel);
                ctx.translate(-canvas.width / 2, -canvas.height / 2);

                if (appState === 'CAPTURE_MARTYR') {
                    drawCover(video);
                    drawXAxisOnly();
                } else if (appState === 'ADJUST_MARTYR' && martyrImage) {
                    drawCover(martyrImage);
                    updateCornersFromCenters();
                    drawOverlay();
                } else if (appState === 'PRODUCTION') {
                    drawCover(video);
                    drawOverlay();
                }

                ctx.restore();
                updateMarkersDOM();
            }

            requestAnimationFrame(mainLoop);
        }

        function drawXAxisOnly() {
            ctx.strokeStyle = 'red';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(0, canvas.height / 2);
            ctx.lineTo(canvas.width, canvas.height / 2);
            ctx.stroke();
        }

        function drawOverlay() {
            ctx.strokeStyle = 'red';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(calibrationConfig.centerLeft.x, calibrationConfig.centerLeft.y);
            ctx.lineTo(calibrationConfig.centerRight.x, calibrationConfig.centerRight.y);
            ctx.stroke();

            let c = calibrationConfig.corners;
            if (c.length === 4) {
                ctx.strokeStyle = appState === 'ADJUST_MARTYR' ? 'cyan' : 'yellow';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(c[0].x, c[0].y);
                ctx.lineTo(c[1].x, c[1].y);
                ctx.lineTo(c[2].x, c[2].y);
                ctx.lineTo(c[3].x, c[3].y);
                ctx.closePath();
                ctx.stroke();
            }
        }

        let activeDraggingMarker = null;

        ['Left', 'Right'].forEach(side => {
            let el = document.getElementById('marker-' + side.toLowerCase());
            
            el.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                activeDraggingMarker = side;
                el.setPointerCapture(e.pointerId);
            });

            el.addEventListener('pointermove', (e) => {
                if (activeDraggingMarker === side) {
                    e.preventDefault();
                    let rect = canvas.getBoundingClientRect();
                    let clientX = e.clientX - rect.left;
                    let clientY = e.clientY - rect.top;
                    
                    let canvasX = (clientX - canvas.width / 2 - panX) / zoomLevel + canvas.width / 2;
                    let canvasY = (clientY - canvas.height / 2 - panY) / zoomLevel + canvas.height / 2;
                    
                    calibrationConfig['center' + side].x = canvasX;
                    calibrationConfig['center' + side].y = canvasY;
                }
            });

            el.addEventListener('pointerup', (e) => {
                if (activeDraggingMarker === side) {
                    activeDraggingMarker = null;
                    try { el.releasePointerCapture(e.pointerId); } catch(err){}
                }
            });
        });

        document.getElementById('zoom-plus').addEventListener('click', () => { zoomLevel = Math.min(zoomLevel + 0.2, 3.0); });
        document.getElementById('zoom-minus').addEventListener('click', () => { 
            zoomLevel = Math.max(zoomLevel - 0.2, 1.0); 
            if (zoomLevel === 1.0) { panX = 0; panY = 0; }
        });
        document.getElementById('reset-view').addEventListener('click', () => { zoomLevel = 1.0; panX = 0; panY = 0; });

        btnAction.addEventListener('click', () => {
            if (appState === 'CAPTURE_MARTYR') {
                let tempCanvas = document.createElement('canvas');
                tempCanvas.width = video.videoWidth || 1280;
                tempCanvas.height = video.videoHeight || 720;
                let tCtx = tempCanvas.getContext('2d');
                tCtx.drawImage(video, 0, 0, tempCanvas.width, tempCanvas.height);
                
                martyrImage = new Image();
                martyrImage.src = tempCanvas.toDataURL();
                martyrImage.onload = () => {
                    appState = 'ADJUST_MARTYR';
                    statusMsg.innerText = "Étape 2 : Positionnez les repères centraux de l'Étalon 11";
                    btnAction.innerText = "✅ Valider et générer JSON";
                    controlPanel.style.display = 'flex';
                };
            } else if (appState === 'ADJUST_MARTYR') {
                updateCornersFromCenters();
                localStorage.setItem('acuitix_etalon11_json', JSON.stringify(calibrationConfig));

                appState = 'PRODUCTION';
                statusMsg.innerText = "🎯 Mode Production actif (Étalon 11 configuré)";
                btnAction.style.display = 'none';
                controlPanel.style.display = 'none';
                zoomLevel = 1.0;
                panX = 0;
                panY = 0;
                btnLeft.style.display = 'block';
                btnRight.style.display = 'block';
            }
        });

        let lastCapturedWithLayers = null;
        let lastCapturedOriginal = null;

        function handleProductionCapture() {
            let origCanvas = document.createElement('canvas');
            origCanvas.width = video.videoWidth || 1280;
            origCanvas.height = video.videoHeight || 720;
            let origCtx = origCanvas.getContext('2d');
            origCtx.drawImage(video, 0, 0, origCanvas.width, origCanvas.height);
            lastCapturedOriginal = origCanvas.toDataURL('image/png');

            let layerCanvas = document.createElement('canvas');
            layerCanvas.width = origCanvas.width;
            layerCanvas.height = origCanvas.height;
            let layerCtx = layerCanvas.getContext('2d');
            layerCtx.drawImage(origCanvas, 0, 0);

            let cw = canvas.width;
            let ch = canvas.height;
            let sw = origCanvas.width;
            let sh = origCanvas.height;
            let hRatio = cw / sw;
            let vRatio = ch / sh;
            let ratio = Math.max(hRatio, vRatio);
            let centerShiftX = (cw - sw * ratio) / 2;
            let centerShiftY = (ch - sh * ratio) / 2;

            function displayToVideo(pt) {
                return {
                    x: (pt.x - centerShiftX) / ratio,
                    y: (pt.y - centerShiftY) / ratio
                };
            }

            let vCl = displayToVideo(calibrationConfig.centerLeft);
            let vCr = displayToVideo(calibrationConfig.centerRight);

            let vDx = vCr.x - vCl.x;
            let vDy = vCr.y - vCl.y;
            let vDist = Math.sqrt(vDx * vDx + vDy * vDy);
            let vAngle = Math.atan2(vDy, vDx);
            let vFw = vDist * ETALON_SPECS.widthRatioFromCenters;
            let vFh = vDist * ETALON_SPECS.heightRatioFromCenters;
            let vCx = (vCl.x + vCr.x) / 2;
            let vCy = (vCl.y + vCr.y) / 2;

            let cos = Math.cos(vAngle);
            let sin = Math.sin(vAngle);
            let hw = vFw / 2;
            let hh = vFh / 2;

            function vRot(lx, ly) {
                return {
                    x: vCx + (lx * cos - ly * sin),
                    y: vCy + (lx * sin + ly * cos)
                };
            }

            let vc = [vRot(-hw, -hh), vRot(hw, -hh), vRot(hw, hh), vRot(-hw, hh)];

            layerCtx.strokeStyle = 'red';
            layerCtx.lineWidth = Math.max(2, 4 / ratio);
            layerCtx.beginPath();
            layerCtx.moveTo(vCl.x, vCl.y);
            layerCtx.lineTo(vCr.x, vCr.y);
            layerCtx.stroke();

            layerCtx.strokeStyle = 'yellow';
            layerCtx.lineWidth = Math.max(2, 4 / ratio);
            layerCtx.beginPath();
            layerCtx.moveTo(vc[0].x, vc[0].y);
            layerCtx.lineTo(vc[1].x, vc[1].y);
            layerCtx.lineTo(vc[2].x, vc[2].y);
            layerCtx.lineTo(vc[3].x, vc[3].y);
            layerCtx.closePath();
            layerCtx.stroke();

            lastCapturedWithLayers = layerCanvas.toDataURL('image/png');

            previewCanvas.width = layerCanvas.width;
            previewCanvas.height = layerCanvas.height;
            let pCtx = previewCanvas.getContext('2d');
            pCtx.drawImage(layerCanvas, 0, 0);
            previewModal.style.display = 'flex';
        }

        btnLeft.addEventListener('click', handleProductionCapture);
        btnRight.addEventListener('click', handleProductionCapture);
        document.getElementById('close-preview').addEventListener('click', () => previewModal.style.display = 'none');

        document.getElementById('dl-with-layers').addEventListener('click', () => {
            let link = document.createElement('a');
            link.download = 'acuitix_etalon11_calques.png';
            link.href = lastCapturedWithLayers;
            link.click();
        });

        document.getElementById('dl-original').addEventListener('click', () => {
            let link = document.createElement('a');
            link.download = 'acuitix_etalon11_originale.png';
            link.href = lastCapturedOriginal;
            link.click();
        });

        document.getElementById('dl-json').addEventListener('click', () => {
            let dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(calibrationConfig, null, 2));
            let link = document.createElement('a');
            link.download = "acuitix_etalon11_config.json";
            link.href = dataStr;
            link.click();
        });
    </script>
</body>
</html>
