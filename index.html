<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Acuitix Optix - Détection Auto Paysage</title>
    <script async src="opencv.js" onload="onOpenCvReady();" type="text/javascript"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }

        #container { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        #videoInput { position: absolute; width: 1px; height: 1px; opacity: 0; }
        #canvasOutput { width: 100%; height: 100%; object-fit: cover; }

        #status { position: absolute; top: 10px; left: 10px; color: yellow; background: rgba(0,0,0,0.5); padding: 5px; font-family: monospace; font-size: 12px; z-index: 100; }
        
        /* Message d'alerte mode portrait */
        #landscape-warning {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95); color: white; z-index: 2000;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 20px; font-size: 20px;
        }

        /* Message d'alerte si le gabarit n'est pas détecté */
        #alert-box {
            position: absolute; top: 50px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 0, 0, 0.8); color: white; padding: 8px 16px;
            border-radius: 20px; font-size: 14px; font-weight: bold; z-index: 150; display: none;
        }
    </style>
</head>
<body>

    <div id="landscape-warning">
        📱<br><br><b>Veuillez tourner votre téléphone en mode paysage</b><br>
        <span style="font-size: 14px; color: #aaa; margin-top: 10px;">L'ETALON11 nécessite une prise de vue horizontale.</span>
    </div>

    <div id="alert-box">⚠️ Gabarit non détecté</div>

    <div id="container">
        <div id="status">Chargement d'OpenCV...</div>
        <video id="videoInput" autoplay playsinline muted></video>
        <canvas id="canvasOutput"></canvas>
    </div>

    <script>
        let video = document.getElementById('videoInput');
        let canvasOutput = document.getElementById('canvasOutput');
        let canvasContext = canvasOutput.getContext('2d');
        let status = document.getElementById('status');
        let alertBox = document.getElementById('alert-box');
        let warningScreen = document.getElementById('landscape-warning');

        let streaming = false;
        let src, gray, blurred, thresh, contours, hierarchy;

        // Vérification de l'orientation en temps réel
        function checkOrientation() {
            if (window.innerHeight > window.innerWidth) {
                warningScreen.style.display = 'flex';
            } else {
                warningScreen.style.display = 'none';
            }
        }
        window.addEventListener('resize', checkOrientation);
        window.addEventListener('orientationchange', checkOrientation);
        checkOrientation();

        function onOpenCvReady() {
            status.innerText = 'OpenCV prêt. Démarrage caméra...';
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })
                .then(function(stream) {
                    video.srcObject = stream;
                    video.play();
                    status.innerText = 'Recherche du gabarit...';
                    startProcessing();
                })
                .catch(function(err) {
                    status.innerText = "Erreur caméra : " + err.message;
                });
        }

        function startProcessing() {
            streaming = true;
            
            video.onloadedmetadata = () => {
                canvasOutput.width = video.videoWidth;
                canvasOutput.height = video.videoHeight;
            };

            src = new cv.Mat(video.videoHeight, video.videoWidth, cv.CV_8UC4);
            gray = new cv.Mat();
            blurred = new cv.Mat();
            thresh = new cv.Mat();
            contours = new cv.MatVector();
            hierarchy = new cv.Mat();

            let cap = new cv.VideoCapture(video);
            
            function processVideo() {
                if (!streaming) return;
                
                try {
                    cap.read(src);
                    
                    cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
                    cv.GaussianBlur(gray, blurred, {width: 5, height: 5}, 0);
                    cv.threshold(blurred, thresh, 0, 255, cv.THRESH_BINARY + cv.THRESH_OTSU);
                    cv.findContours(thresh, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

                    let largestContour = null;
                    let maxArea = 0;

                    for (let i = 0; i < contours.size(); ++i) {
                        let cnt = contours.get(i);
                        let area = cv.contourArea(cnt);
                        
                        if (area > (canvasOutput.width * canvasOutput.height) * 0.1) {
                            let perimeter = cv.arcLength(cnt, true);
                            let approx = new cv.Mat();
                            cv.approxPolyDP(cnt, approx, 0.02 * perimeter, true);
                            
                            if (approx.rows === 4 && area > maxArea) {
                                maxArea = area;
                                largestContour = approx;
                            } else {
                                approx.delete();
                            }
                        }
                    }

                    canvasContext.drawImage(video, 0, 0, canvasOutput.width, canvasOutput.height);

                    if (largestContour) {
                        drawRepere(largestContour);
                        alertBox.style.display = 'none';
                        largestContour.delete();
                    } else {
                        alertBox.style.display = 'block';
                    }

                } catch (err) {
                    console.log(err);
                }
                
                requestAnimationFrame(processVideo);
            }

            processVideo();
        }

        function drawRepere(contour) {
            let points = [];
            for (let i = 0; i < 4; i++) {
                points.push({x: contour.data32S[i * 2], y: contour.data32S[i * 2 + 1]});
            }

            let centerY = (points[0].y + points[2].y) / 2;

            // Axe X rouge
            canvasContext.beginPath();
            canvasContext.moveTo(points[0].x, centerY);
            canvasContext.lineTo(points[1].x, centerY);
            canvasContext.strokeStyle = 'red';
            canvasContext.lineWidth = 3;
            canvasContext.stroke();

            // Coins jaunes proportionnels
            canvasContext.strokeStyle = 'yellow';
            canvasContext.lineWidth = 5;
            const cornerSize = 50;

            points.forEach(p => {
                canvasContext.strokeRect(p.x - cornerSize/2, p.y - cornerSize/2, cornerSize, cornerSize);
            });
        }
    </script>
</body>
</html>
