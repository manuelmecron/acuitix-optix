<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Acuitix Optix - ETALON11NW Robuste</title>
    <script async src="https://docs.opencv.org/4.5.0/opencv.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }

        #app-container { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        #videoInput { position: absolute; width: 1px; height: 1px; opacity: 0; }
        #canvasOutput { width: 100%; height: 100%; object-fit: cover; }

        /* Axe X rouge continu de part en part */
        .red-axis {
            position: absolute; top: 50%; left: 0; width: 100%; height: 2px;
            background: red; transform: translateY(-50%); pointer-events: none; z-index: 10;
        }

        /* Boutons de capture ergonomiques (pouces gauche/droite) */
        .capture-btn {
            position: absolute; bottom: 20px; background: #28a745; color: white; border: none;
            padding: 15px 25px; border-radius: 30px; font-size: 16px; font-weight: bold;
            cursor: pointer; z-index: 20; box-shadow: 0 4px 10px rgba(0,0,0,0.6);
        }
        #btn-left { left: 30px; }
        #btn-right { right: 30px; }

        #landscape-warning {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95); color: white; z-index: 2000;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 20px; font-size: 20px;
        }

        #status-msg {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); color: yellow; padding: 6px 14px;
            border-radius: 15px; font-size: 13px; z-index: 15; font-family: monospace;
        }

        #preview-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92); z-index: 3000; display: none;
            flex-direction: column; align-items: center; justify-content: center; padding: 10px;
        }
        #preview-canvas { max-width: 90vw; max-height: 65vh; border: 2px solid white; object-fit: contain; }
        .modal-actions { margin-top: 15px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .modal-actions button {
            padding: 10px 16px; background: #007bff; color: white; border: none; border-radius: 6px;
            font-size: 14px; cursor: pointer; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.4);
        }
        .modal-actions button.secondary { background: #6c757d; }
    </style>
</head>
<body>

    <div id="landscape-warning">
        📱<br><br><b>Veuillez tourner votre téléphone en mode paysage</b>
    </div>

    <div id="status-msg">Initialisation...</div>

    <div id="preview-modal">
        <canvas id="preview-canvas"></canvas>
        <div class="modal-actions">
            <button id="dl-with-layers">💾 Télécharger avec calques</button>
            <button id="dl-original" class="secondary">📥 Télécharger originale</button>
            <button id="share-btn" class="secondary">📤 Partager</button>
            <button id="close-preview" style="background: #dc3545;">❌ Fermer</button>
        </div>
    </div>

    <div id="app-container">
        <video id="videoInput" autoplay playsinline muted></video>
        <canvas id="canvasOutput"></canvas>
        <div class="red-axis"></div>
        
        <button class="capture-btn" id="btn-left">📸 Capturer</button>
        <button class="capture-btn" id="btn-right">📸 Capturer</button>
    </div>

    <script>
        let video = document.getElementById('videoInput');
        let canvasOutput = document.getElementById('canvasOutput');
        let ctx = canvasOutput.getContext('2d');
        let warningScreen = document.getElementById('landscape-warning');
        let statusMsg = document.getElementById('status-msg');
        let previewModal = document.getElementById('preview-modal');
        let previewCanvas = document.getElementById('preview-canvas');
        let previewCtx = previewCanvas.getContext('2d');

        let streaming = false;
        let detectedCorners = null;

        function checkOrientation() {
            if (window.innerHeight > window.innerWidth) {
                warningScreen.style.display = 'flex';
            } else {
                warningScreen.style.display = 'none';
            }
        }
        window.addEventListener('resize', checkOrientation);
        window.addEventListener('orientationchange', checkOrientation);
        checkOrientation();

        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })
            .then(stream => {
                video.srcObject = stream;
                video.play();
                streaming = true;
                requestAnimationFrame(processFrame);
            })
            .catch(err => alert("Erreur caméra : " + err.message));

        let src, hsv, mask1, mask2, mask, contours, hierarchy;
        function initOpenCVObjects() {
            if (typeof cv !== 'undefined' && cv.Mat) {
                src = new cv.Mat();
                hsv = new cv.Mat();
                mask1 = new cv.Mat();
                mask2 = new cv.Mat();
                mask = new cv.Mat();
                contours = new cv.MatVector();
                hierarchy = new cv.Mat();
            } else {
                setTimeout(initOpenCVObjects, 500);
            }
        }
        setTimeout(initOpenCVObjects, 1000);

        function processFrame() {
            if (!streaming) return;

            if (video.videoWidth > 0 && canvasOutput.width !== video.videoWidth) {
                canvasOutput.width = video.videoWidth;
                canvasOutput.height = video.videoHeight;
            }

            ctx.drawImage(video, 0, 0, canvasOutput.width, canvasOutput.height);

            if (typeof cv !== 'undefined' && src && video.videoWidth > 0) {
                try {
                    let cap = new cv.VideoCapture(video);
                    cap.read(src);

                    cv.cvtColor(src, hsv, cv.COLOR_RGBA2RGB);
                    cv.cvtColor(hsv, hsv, cv.COLOR_RGB2HSV);

                    // Plages HSV élargies pour tolérer l'éclairage de bureau/LED
                    let low1 = new cv.Mat(hsv.rows, hsv.cols, hsv.type(), [0, 40, 40, 0]);
                    let high1 = new cv.Mat(hsv.rows, hsv.cols, hsv.type(), [15, 255, 255, 255]);
                    cv.inRange(hsv, low1, high1, mask1);

                    let low2 = new cv.Mat(hsv.rows, hsv.cols, hsv.type(), [165, 40, 40, 0]);
                    let high2 = new cv.Mat(hsv.rows, hsv.cols, hsv.type(), [180, 255, 255, 255]);
                    cv.inRange(hsv, low2, high2, mask2);

                    cv.add(mask1, mask2, mask);
                    low1.delete(); high1.delete(); low2.delete(); high2.delete();

                    let M = cv.Mat.ones(3, 3, cv.CV_8U);
                    cv.morphologyEx(mask, mask, cv.MORPH_OPEN, M);
                    M.delete();

                    cv.findContours(mask, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

                    let redCenters = [];
                    let totalArea = canvasOutput.width * canvasOutput.height;

                    for (let i = 0; i < contours.size(); ++i) {
                        let cnt = contours.get(i);
                        let area = cv.contourArea(cnt);
                        // Filtre de taille dynamique (de très petit à large selon le zoom)
                        if (area > 20 && area < totalArea * 0.1) {
                            let M_mom = cv.moments(cnt);
                            if (M_mom.m00 > 0) {
                                let cx = M_mom.m10 / M_mom.m00;
                                let cy = M_mom.m01 / M_mom.m00;
                                redCenters.push({x: cx, y: cy});
                            }
                        }
                    }

                    if (redCenters.length >= 4) {
                        redCenters.sort((a, b) => a.x - b.x);
                        let lefts = [redCenters[0], redCenters[1]].sort((a, b) => a.y - b.y);
                        let rights = [redCenters[redCenters.length-2], redCenters[redCenters.length-1]].sort((a, b) => a.y - b.y);
                        
                        detectedCorners = [lefts[0], rights[0], rights[1], lefts[1]];
                        drawLiveCorners(detectedCorners, 'yellow');
                        statusMsg.innerText = "✅ 4 repères rouges détectés";
                        statusMsg.style.color = "#28a745";
                    } else {
                        detectedCorners = null;
                        // Affichage d'un gabarit de secours proportionnel (ratio 1.7 - ETALON11)
                        let w = canvasOutput.width * 0.5;
                        let h = w / 1.7;
                        let x = (canvasOutput.width - w) / 2;
                        let y = (canvasOutput.height - h) / 2;
                        detectedCorners = [
                            {x: x, y: y}, {x: x+w, y: y}, {x: x+w, y: y+h}, {x: x, y: y+h}
                        ];
                        drawLiveCorners(detectedCorners, 'orange');
                        statusMsg.innerText = `🔍 Repères rouges partiels (${redCenters.length}/4) - Mode Secours ETALON11`;
                        statusMsg.style.color = "orange";
                    }

                } catch (e) {
                    console.error(e);
                }
            }

            requestAnimationFrame(processFrame);
        }

        function drawLiveCorners(corners, color) {
            ctx.strokeStyle = color;
            ctx.lineWidth = 4;
            const size = 45;
            corners.forEach(p => {
                ctx.strokeRect(p.x - size / 2, p.y - size / 2, size, size);
            });
        }

        let lastCapturedWithLayers = null;
        let lastCapturedOriginal = null;

        function handleCapture() {
            let origCanvas = document.createElement('canvas');
            origCanvas.width = video.videoWidth;
            origCanvas.height = video.videoHeight;
            let origCtx = origCanvas.getContext('2d');
            origCtx.drawImage(video, 0, 0);
            lastCapturedOriginal = origCanvas.toDataURL('image/png');

            let layerCanvas = document.createElement('canvas');
            layerCanvas.width = video.videoWidth;
            layerCanvas.height = video.videoHeight;
            let layerCtx = layerCanvas.getContext('2d');
            layerCtx.drawImage(origCanvas, 0, 0);

            // Axe X rouge continu
            layerCtx.strokeStyle = 'red';
            layerCtx.lineWidth = 4;
            layerCtx.beginPath();
            layerCtx.moveTo(0, layerCanvas.height / 2);
            layerCtx.lineTo(layerCanvas.width, layerCanvas.height / 2);
            layerCtx.stroke();

            // Calquage des coins (détectés ou de secours)
            if (detectedCorners && detectedCorners.length === 4) {
                layerCtx.strokeStyle = 'yellow';
                layerCtx.lineWidth = 5;
                detectedCorners.forEach(p => {
                    layerCtx.strokeRect(p.x - 30, p.y - 30, 60, 60);
                });
            }

            lastCapturedWithLayers = layerCanvas.toDataURL('image/png');

            previewCanvas.width = layerCanvas.width;
            previewCanvas.height = layerCanvas.height;
            previewCtx.drawImage(layerCanvas, 0, 0);
            previewModal.style.display = 'flex';
        }

        document.getElementById('btn-left').addEventListener('click', handleCapture);
        document.getElementById('btn-right').addEventListener('click', handleCapture);
        document.getElementById('close-preview').addEventListener('click', () => previewModal.style.display = 'none');

        document.getElementById('dl-with-layers').addEventListener('click', () => {
            let link = document.createElement('a');
            link.download = 'etalon11nw_avec_calques.png';
            link.href = lastCapturedWithLayers;
            link.click();
        });

        document.getElementById('dl-original').addEventListener('click', () => {
            let link = document.createElement('a');
            link.download = 'etalon11nw_originale.png';
            link.href = lastCapturedOriginal;
            link.click();
        });

        document.getElementById('share-btn').addEventListener('click', async () => {
            if (navigator.share) {
                try {
                    let blob = await (await fetch(lastCapturedWithLayers)).blob();
                    let file = new File([blob], "etalon11nw.png", { type: "image/png" });
                    await navigator.share({ title: 'Acuitix Optix - Capture', files: [file] });
                } catch (err) {
                    console.log("Partage annulé");
                }
            } else {
                alert("Le partage natif n'est pas pris en charge.");
            }
        });
    </script>
</body>
</html>
