<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Acuitix Optix - Calibration Martyr & Production</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }

        #app-container { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        #videoInput { position: absolute; width: 1px; height: 1px; opacity: 0; }
        #canvasOutput { width: 100%; height: 100%; object-fit: cover; }

        /* Éléments d'interface et boutons */
        .ui-btn {
            position: absolute; bottom: 20px; background: #28a745; color: white; border: none;
            padding: 15px 25px; border-radius: 30px; font-size: 16px; font-weight: bold;
            cursor: pointer; z-index: 20; box-shadow: 0 4px 10px rgba(0,0,0,0.6);
        }
        #btn-action { left: 50%; transform: translateX(-50%); }
        #btn-left { left: 30px; display: none; }
        #btn-right { right: 30px; display: none; }

        #status-msg {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); color: yellow; padding: 8px 16px;
            border-radius: 15px; font-size: 14px; z-index: 25; font-family: monospace; text-align: center;
        }

        #landscape-warning {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95); color: white; z-index: 2000;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 20px; font-size: 20px;
        }

        #preview-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92); z-index: 3000; display: none;
            flex-direction: column; align-items: center; justify-content: center; padding: 10px;
        }
        #preview-canvas { max-width: 90vw; max-height: 65vh; border: 2px solid white; object-fit: contain; }
        .modal-actions { margin-top: 15px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .modal-actions button {
            padding: 10px 16px; background: #007bff; color: white; border: none; border-radius: 6px;
            font-size: 14px; cursor: pointer; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.4);
        }
        .modal-actions button.secondary { background: #6c757d; }
    </style>
</head>
<body>

    <div id="landscape-warning">
        📱<br><br><b>Veuillez tourner votre téléphone en mode paysage</b>
    </div>

    <div id="status-msg">Étape 1 : Prenez votre photo martyr de référence</div>

    <div id="preview-modal">
        <canvas id="preview-canvas"></canvas>
        <div class="modal-actions">
            <button id="dl-with-layers">💾 Télécharger avec calques</button>
            <button id="dl-original" class="secondary">📥 Télécharger originale</button>
            <button id="share-btn" class="secondary">📤 Partager</button>
            <button id="close-preview" style="background: #dc3545;">❌ Fermer</button>
        </div>
    </div>

    <div id="app-container">
        <video id="videoInput" autoplay playsinline muted></video>
        <canvas id="canvasOutput"></canvas>
        
        <button class="ui-btn" id="btn-action">📸 Prendre la Photo Martyr</button>
        <button class="ui-btn" id="btn-left">📸 Capturer</button>
        <button class="ui-btn" id="btn-right">📸 Capturer</button>
    </div>

    <script>
        let video = document.getElementById('videoInput');
        let canvas = document.getElementById('canvasOutput');
        let ctx = canvas.getContext('2d');
        let statusMsg = document.getElementById('status-msg');
        let btnAction = document.getElementById('btn-action');
        let btnLeft = document.getElementById('btn-left');
        let btnRight = document.getElementById('btn-right');
        let warningScreen = document.getElementById('landscape-warning');

        let previewModal = document.getElementById('preview-modal');
        let previewCanvas = document.getElementById('preview-canvas');
        let previewCtx = previewCanvas.getContext('2d');

        let appState = 'CAPTURE_MARTYR'; // CAPTURE_MARTYR -> ADJUST_MARTYR -> PRODUCTION
        let martyrImage = null;
        let streaming = false;

        // Coordonnées interactives des 4 coins du gabarit (initialisées au centre par défaut)
        let corners = [];
        let activeCornerIndex = null;

        function checkOrientation() {
            if (window.innerHeight > window.innerWidth) {
                warningScreen.style.display = 'flex';
            } else {
                warningScreen.style.display = 'none';
            }
        }
        window.addEventListener('resize', checkOrientation);
        window.addEventListener('orientationchange', checkOrientation);
        checkOrientation();

        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })
            .then(stream => {
                video.srcObject = stream;
                video.play();
                streaming = true;
                requestAnimationFrame(mainLoop);
            })
            .catch(err => alert("Erreur caméra : " + err.message));

        function initDefaultCorners(w, h) {
            let bw = w * 0.4;
            let bh = bw / 1.7;
            let cx = w / 2;
            let cy = h / 2;
            corners = [
                {x: cx - bw/2, y: cy - bh/2}, // Haut-Gauche
                {x: cx + bw/2, y: cy - bh/2}, // Haut-Droit
                {x: cx + bw/2, y: cy + bh/2}, // Bas-Droit
                {x: cx - bw/2, y: cy + bh/2}  // Bas-Gauche
            ];
        }

        function mainLoop() {
            if (!streaming) return;

            if (video.videoWidth > 0 && canvas.width !== video.videoWidth) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                initDefaultCorners(canvas.width, canvas.height);
            }

            if (appState === 'CAPTURE_MARTYR' || appState === 'PRODUCTION') {
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                if (appState === 'PRODUCTION') {
                    drawOverlay();
                }
            } else if (appState === 'ADJUST_MARTYR') {
                // Afficher l'image martyr figée avec les coins déplaçables
                ctx.drawImage(martyrImage, 0, 0);
                drawOverlay();
            }

            requestAnimationFrame(mainLoop);
        }

        function drawOverlay() {
            // Axe X rouge invariable (reliant le milieu gauche au milieu droit ou calculé depuis les coins)
            let midLeftY = (corners[0].y + corners[3].y) / 2;
            let midRightY = (corners[1].y + corners[2].y) / 2;

            ctx.strokeStyle = 'red';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, (midLeftY + midRightY) / 2);
            ctx.lineTo(canvas.width, (midLeftY + midRightY) / 2);
            ctx.stroke();

            // Cadre et poignées des 4 coins
            ctx.strokeStyle = appState === 'ADJUST_MARTYR' ? 'cyan' : 'yellow';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(corners[0].x, corners[0].y);
            ctx.lineTo(corners[1].x, corners[1].y);
            ctx.lineTo(corners[2].x, corners[2].y);
            ctx.lineTo(corners[3].x, corners[3].y);
            ctx.closePath();
            ctx.stroke();

            // Dessiner les poignées tactiles carrées
            corners.forEach((p, idx) => {
                ctx.fillStyle = (activeCornerIndex === idx) ? '#ff00ff' : 'yellow';
                ctx.fillRect(p.x - 20, p.y - 20, 40, 40);
                ctx.fillStyle = 'black';
                ctx.font = '12px sans-serif';
                ctx.fillText(['TL', 'TR', 'BR', 'BL'][idx], p.x - 8, p.y + 4);
            });
        }

        // Gestion du tactile/souris pour déplacer les coins lors de l'ajustement de la photo martyr
        function getTouchPos(e) {
            let rect = canvas.getBoundingClientRect();
            let clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let clientY = e.touches ? e.touches[0].clientY : e.clientY;
            // Adapter au ratio réel du canvas
            let scaleX = canvas.width / rect.width;
            let scaleY = canvas.height / rect.height;
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        canvas.addEventListener('pointerdown', (e) => {
            if (appState !== 'ADJUST_MARTYR') return;
            let pos = getTouchPos(e);
            // Trouver le coin le plus proche touché (rayon de 50px)
            corners.forEach((p, idx) => {
                let dist = Math.hypot(p.x - pos.x, p.y - pos.y);
                if (dist < 60) {
                    activeCornerIndex = idx;
                }
            });
        });

        canvas.addEventListener('pointermove', (e) => {
            if (appState !== 'ADJUST_MARTYR' || activeCornerIndex === null) return;
            let pos = getTouchPos(e);
            corners[activeCornerIndex].x = pos.x;
            corners[activeCornerIndex].y = pos.y;
        });

        canvas.addEventListener('pointerup', () => { activeCornerIndex = null; });
        canvas.addEventListener('pointercancel', () => { activeCornerIndex = null; });

        // Gestion des boutons d'action selon l'état
        btnAction.addEventListener('click', () => {
            if (appState === 'CAPTURE_MARTYR') {
                // Figer l'image martyr
                let tempCanvas = document.createElement('canvas');
                tempCanvas.width = canvas.width;
                tempCanvas.height = canvas.height;
                let tCtx = tempCanvas.getContext('2d');
                tCtx.drawImage(video, 0, 0);
                
                martyrImage = new Image();
                martyrImage.src = tempCanvas.toDataURL();
                martyrImage.onload = () => {
                    appState = 'ADJUST_MARTYR';
                    statusMsg.innerText = "Étape 2 : Glissez les 4 coins sur votre étalon réel, puis validez";
                    btnAction.innerText = "✅ Valider l'étalonnage";
                };
            } else if (appState === 'ADJUST_MARTYR') {
                // Verrouiller l'étalonnage et passer en production
                appState = 'PRODUCTION';
                statusMsg.innerText = "🎯 Mode Production actif (Calage verrouillé)";
                btnAction.style.display = 'none';
                btnLeft.style.display = 'block';
                btnRight.style.display = 'block';
            }
        });

        // Fonction de capture définitive en mode production
        let lastCapturedWithLayers = null;
        let lastCapturedOriginal = null;

        function handleProductionCapture() {
            let origCanvas = document.createElement('canvas');
            origCanvas.width = video.videoWidth;
            origCanvas.height = video.videoHeight;
            let origCtx = origCanvas.getContext('2d');
            origCtx.drawImage(video, 0, 0);
            lastCapturedOriginal = origCanvas.toDataURL('image/png');

            let layerCanvas = document.createElement('canvas');
            layerCanvas.width = video.videoWidth;
            layerCanvas.height = video.videoHeight;
            let layerCtx = layerCanvas.getContext('2d');
            layerCtx.drawImage(origCanvas, 0, 0);

            // Redessiner l'axe rouge et le cadre calibré sur la photo finale
            let midLeftY = (corners[0].y + corners[3].y) / 2;
            let midRightY = (corners[1].y + corners[2].y) / 2;
            layerCtx.strokeStyle = 'red';
            layerCtx.lineWidth = 4;
            layerCtx.beginPath();
            layerCtx.moveTo(0, (midLeftY + midRightY) / 2);
            layerCtx.lineTo(layerCanvas.width, (midLeftY + midRightY) / 2);
            layerCtx.stroke();

            layerCtx.strokeStyle = 'yellow';
            layerCtx.lineWidth = 4;
            layerCtx.beginPath();
            layerCtx.moveTo(corners[0].x, corners[0].y);
            layerCtx.lineTo(corners[1].x, corners[1].y);
            layerCtx.lineTo(corners[2].x, corners[2].y);
            layerCtx.lineTo(corners[3].x, corners[3].y);
            layerCtx.closePath();
            layerCtx.stroke();

            lastCapturedWithLayers = layerCanvas.toDataURL('image/png');

            previewCanvas.width = layerCanvas.width;
            previewCanvas.height = layerCanvas.height;
            let pCtx = previewCanvas.getContext('2d');
            pCtx.drawImage(layerCanvas, 0, 0);
            previewModal.style.display = 'flex';
        }

        btnLeft.addEventListener('click', handleProductionCapture);
        btnRight.addEventListener('click', handleProductionCapture);
        document.getElementById('close-preview').addEventListener('click', () => previewModal.style.display = 'none');

        document.getElementById('dl-with-layers').addEventListener('click', () => {
            let link = document.createElement('a');
            link.download = 'etalon11_prod_calques.png';
            link.href = lastCapturedWithLayers;
            link.click();
        });

        document.getElementById('dl-original').addEventListener('click', () => {
            let link = document.createElement('a');
            link.download = 'etalon11_prod_originale.png';
            link.href = lastCapturedOriginal;
            link.click();
        });

        document.getElementById('share-btn').addEventListener('click', async () => {
            if (navigator.share) {
                try {
                    let blob = await (await fetch(lastCapturedWithLayers)).blob();
                    let file = new File([blob], "etalon11_production.png", { type: "image/png" });
                    await navigator.share({ title: 'Acuitix Optix - Production', files: [file] });
                } catch (err) {
                    console.log("Partage annulé");
                }
            } else {
                alert("Le partage natif n'est pas pris en charge.");
            }
        });
    </script>
</body>
</html>
