<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Acuitix Optix - ETALON11</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }

        #camera-container { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        #videoElement { width: 100%; height: 100%; object-fit: cover; }

        /* Conteneur géométrique aux proportions exactes du plan (170x100) */
        #gabarit-cadre {
            position: absolute;
            width: 85vw;
            max-width: 650px;
            aspect-ratio: 170 / 100;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        /* Axe X rouge pile au milieu (hauteur 50%) */
        #axe-x {
            position: absolute; top: 50%; left: 0; width: 100%; height: 2px;
            background: red; transform: translateY(-50%);
        }

        /* Les 4 coins proportionnels aux carrés de 15x15 mm sur une base de 170x100 mm */
        .corner {
            position: absolute;
            width: calc(15 / 170 * 100%);
            height: calc(15 / 100 * 100%);
            border-color: yellow; border-style: solid;
        }
        #corner-tl { top: 0; left: 0; border-width: 4px 0 0 4px; }
        #corner-tr { top: 0; right: 0; border-width: 4px 4px 0 0; }
        #corner-bl { bottom: 0; left: 0; border-width: 0 0 4px 4px; }
        #corner-br { bottom: 0; right: 0; border-width: 0 4px 4px 0; }

        /* Bouton de capture */
        #capture-btn {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: #28a745; color: white; border: none; padding: 14px 28px;
            border-radius: 30px; font-size: 18px; font-weight: bold; cursor: pointer; z-index: 10;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
        }

        /* Message d'alerte si le téléphone est en mode portrait */
        #landscape-warning {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9); color: white; z-index: 1000;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 20px; font-size: 20px;
        }
    </style>
</head>
<body>

    <div id="landscape-warning">
        📱<br><br><b>Veuillez tourner votre téléphone en mode paysage</b><br><span style="font-size: 14px; color: #aaa; margin-top: 10px;">Le gabarit ETALON11 nécessite une prise de vue horizontale.</span>
    </div>

    <div id="camera-container">
        <video id="videoElement" autoplay playsinline muted></video>
        
        <div id="gabarit-cadre">
            <div id="axe-x"></div>
            <div class="corner" id="corner-tl"></div>
            <div class="corner" id="corner-tr"></div>
            <div class="corner" id="corner-bl"></div>
            <div class="corner" id="corner-br"></div>
        </div>

        <button id="capture-btn">📸 Capturer</button>
    </div>

    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('videoElement');
        const captureBtn = document.getElementById('capture-btn');
        const canvas = document.getElementById('canvas');
        const warningScreen = document.getElementById('landscape-warning');

        function checkOrientation() {
            if (window.innerHeight > window.innerWidth) {
                warningScreen.style.display = 'flex';
            } else {
                warningScreen.style.display = 'none';
            }
        }

        window.addEventListener('resize', checkOrientation);
        window.addEventListener('orientationchange', checkOrientation);
        checkOrientation();

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: 'environment' } },
                    audio: false
                });
                video.srcObject = stream;
            } catch (err) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: 'environment' },
                        audio: false
                    });
                    video.srcObject = stream;
                } catch (e) {
                    alert("Impossible d'accéder à la caméra : " + e.message);
                }
            }
        }

        startCamera();

        captureBtn.addEventListener('click', () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const dataUrl = canvas.toDataURL('image/png');
            let win = window.open();
            win.document.write(`<h3 style="font-family:sans-serif; text-align:center;">ETALON11 - Capturé</h3><div style="text-align:center;"><img src="${dataUrl}" style="max-width:90%; border:2px solid black;"/></div>`);
        });
    </script>
</body>
</html>
