<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Acuitix Optix - Calibration & Navigation</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }

        #app-container { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        #videoInput { display: none; }
        #canvasOutput { width: 100%; height: 100%; display: block; }

        .ui-btn {
            position: absolute; bottom: 20px; background: #28a745; color: white; border: none;
            padding: 14px 22px; border-radius: 30px; font-size: 15px; font-weight: bold;
            cursor: pointer; z-index: 20; box-shadow: 0 4px 10px rgba(0,0,0,0.6);
        }
        #btn-action { left: 50%; transform: translateX(-50%); }
        #btn-left { left: 20px; display: none; }
        #btn-right { right: 20px; display: none; }

        #status-msg {
            position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.85); color: yellow; padding: 6px 14px;
            border-radius: 15px; font-size: 13px; z-index: 25; font-family: monospace; text-align: center;
        }

        #control-panel {
            position: absolute; bottom: 80px; width: 100%; display: none;
            justify-content: space-around; align-items: center; padding: 0 10px; z-index: 25; pointer-events: none;
        }
        .interactive-ui { pointer-events: auto; }

        /* Blocs HTML interactifs pour les coins (SG, SD, ID, IG) */
        .corner-box {
            position: absolute; width: 44px; height: 44px; border: 2px solid #333;
            font-weight: bold; font-size: 13px; display: none; align-items: center; justify-content: center;
            cursor: pointer; z-index: 26; box-shadow: 0 2px 6px rgba(0,0,0,0.5); user-select: none;
        }
        #box-sg { background: #ffeb3b; color: black; }
        #box-sd { background: #ffeb3b; color: black; }
        #box-id { background: #ffeb3b; color: black; }
        #box-ig { background: #ffeb3b; color: black; }

        /* D-Pad Coins */
        .dpad {
            position: relative; width: 100px; height: 100px; background: rgba(50,50,50,0.85);
            border-radius: 50%; border: 2px solid #777; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .dpad button {
            position: absolute; background: #444; color: white; border: 1px solid #666; font-weight: bold; cursor: pointer;
        }
        .dpad-up { top: 3px; left: 32px; width: 36px; height: 30px; border-radius: 6px 6px 0 0; }
        .dpad-down { bottom: 3px; left: 32px; width: 36px; height: 30px; border-radius: 0 0 6px 6px; }
        .dpad-left { top: 32px; left: 3px; width: 30px; height: 36px; border-radius: 6px 0 0 6px; }
        .dpad-right { top: 32px; right: 3px; width: 30px; height: 36px; border-radius: 0 6px 6px 0; }
        .dpad-center { top: 32px; left: 32px; width: 36px; height: 36px; background: #007bff; border-radius: 50%; font-size: 10px; display: flex; align-items: center; justify-content: center; }

        /* Panneau de navigation 4 axes (PAN) */
        .pan-pad {
            position: relative; width: 100px; height: 100px; background: rgba(30,30,50,0.85);
            border-radius: 50%; border: 2px solid #55a; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .pan-pad button {
            position: absolute; background: #335; color: white; border: 1px solid #668; font-weight: bold; cursor: pointer;
        }
        .pan-up { top: 3px; left: 32px; width: 36px; height: 30px; border-radius: 6px 6px 0 0; }
        .pan-down { bottom: 3px; left: 32px; width: 36px; height: 30px; border-radius: 0 0 6px 6px; }
        .pan-left { top: 32px; left: 3px; width: 30px; height: 36px; border-radius: 6px 0 0 6px; }
        .pan-right { top: 32px; right: 3px; width: 30px; height: 36px; border-radius: 0 6px 6px 0; }
        .pan-center { top: 32px; left: 32px; width: 36px; height: 36px; background: #17a2b8; border-radius: 50%; font-size: 9px; display: flex; align-items: center; justify-content: center; }

        .tools-group { display: flex; flex-direction: column; gap: 5px; }
        .tool-row { display: flex; gap: 5px; }
        .tool-btn {
            background: rgba(30,30,30,0.9); color: white; border: 1px solid #777;
            padding: 6px 8px; border-radius: 6px; font-weight: bold; font-size: 11px; cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.4);
        }

        #landscape-warning {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95); color: white; z-index: 2000;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 20px; font-size: 20px;
        }

        #preview-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92); z-index: 3000; display: none;
            flex-direction: column; align-items: center; justify-content: center; padding: 10px;
        }
        #preview-canvas { max-width: 90vw; max-height: 65vh; border: 2px solid white; object-fit: contain; }
        .modal-actions { margin-top: 15px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .modal-actions button {
            padding: 10px 16px; background: #007bff; color: white; border: none; border-radius: 6px;
            font-size: 14px; cursor: pointer; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.4);
        }
        .modal-actions button.secondary { background: #6c757d; }
    </style>
</head>
<body>

    <div id="landscape-warning">
        📱<br><br><b>Veuillez tourner votre téléphone en mode paysage</b>
    </div>

    <div id="status-msg">Étape 1 : Prenez la photo martyr guidé par l'axe X</div>

    <!-- Blocs HTML pour les 4 coins interactifs -->
    <div class="corner-box" id="box-sg">SG</div>
    <div class="corner-box" id="box-sd">SD</div>
    <div class="corner-box" id="box-id">ID</div>
    <div class="corner-box" id="box-ig">IG</div>

    <div id="control-panel">
        <!-- Groupe Outils (Zoom / Échelle) -->
        <div class="tools-group interactive-ui">
            <div class="tool-row">
                <button class="tool-btn" id="zoom-plus">Zoom +</button>
                <button class="tool-btn" id="zoom-minus">Zoom -</button>
            </div>
            <div class="tool-row">
                <button class="tool-btn" id="scale-plus">Échelle +</button>
                <button class="tool-btn" id="scale-minus">Échelle -</button>
            </div>
        </div>

        <!-- Pad de Navigation 4 axes (PAN) -->
        <div class="pan-pad interactive-ui">
            <button class="pan-up" id="pan-up">▲</button>
            <button class="pan-down" id="pan-down">▼</button>
            <button class="pan-left" id="pan-left">◀</button>
            <button class="pan-right" id="pan-right">▶</button>
            <div class="pan-center">PAN</div>
        </div>

        <!-- D-Pad Déplacement des coins (SG, SD, ID, IG) -->
        <div class="dpad interactive-ui">
            <button class="dpad-up" id="dpad-up">▲</button>
            <button class="dpad-down" id="dpad-down">▼</button>
            <button class="dpad-left" id="dpad-left">◀</button>
            <button class="dpad-right" id="dpad-right">▶</button>
            <button class="dpad-center" id="dpad-center">SG</button>
        </div>
    </div>

    <div id="preview-modal">
        <canvas id="preview-canvas"></canvas>
        <div class="modal-actions">
            <button id="dl-with-layers">💾 Télécharger avec calques</button>
            <button id="dl-original" class="secondary">📥 Télécharger originale</button>
            <button id="share-btn" class="secondary">📤 Partager</button>
            <button id="close-preview" style="background: #dc3545;">❌ Fermer</button>
        </div>
    </div>

    <div id="app-container">
        <video id="videoInput" autoplay playsinline muted></video>
        <canvas id="canvasOutput"></canvas>
        
        <button class="ui-btn" id="btn-action">📸 Prendre la Photo Martyr</button>
        <button class="ui-btn" id="btn-left">📸 Capturer</button>
        <button class="ui-btn" id="btn-right">📸 Capturer</button>
    </div>

    <script>
        let video = document.getElementById('videoInput');
        let canvas = document.getElementById('canvasOutput');
        let ctx = canvas.getContext('2d');
        let statusMsg = document.getElementById('status-msg');
        let btnAction = document.getElementById('btn-action');
        let btnLeft = document.getElementById('btn-left');
        let btnRight = document.getElementById('btn-right');
        let controlPanel = document.getElementById('control-panel');
        let warningScreen = document.getElementById('landscape-warning');
        let centerDpadBtn = document.getElementById('dpad-center');

        let previewModal = document.getElementById('preview-modal');
        let previewCanvas = document.getElementById('preview-canvas');

        let appState = 'CAPTURE_MARTYR'; 
        let martyrImage = null;
        let streaming = false;

        let corners = [];
        let activeCornerIndex = 0; 
        const cornerNames = ['SG', 'SD', 'ID', 'IG'];

        let zoomLevel = 1.0;
        let panX = 0;
        let panY = 0;

        function checkOrientation() {
            if (window.innerHeight > window.innerWidth) {
                warningScreen.style.display = 'flex';
            } else {
                warningScreen.style.display = 'none';
            }
        }
        window.addEventListener('resize', checkOrientation);
        window.addEventListener('orientationchange', checkOrientation);
        checkOrientation();

        function resizeCanvasToDisplay() {
            let displayWidth = window.innerWidth;
            let displayHeight = window.innerHeight;
            if (canvas.width !== displayWidth || canvas.height !== displayHeight) {
                canvas.width = displayWidth;
                canvas.height = displayHeight;
            }
        }

        function initDefaultCorners(w, h) {
            let savedConfig = localStorage.getItem('acuitix_config');
            if (savedConfig) {
                try {
                    corners = JSON.parse(savedConfig);
                    return;
                } catch(e) { console.error("Erreur lecture JSON config"); }
            }

            let bw = w * 0.4;
            let bh = bw / 1.7;
            let cx = w / 2;
            let cy = h / 2;
            corners = [
                {x: cx - bw/2, y: cy - bh/2}, 
                {x: cx + bw/2, y: cy - bh/2}, 
                {x: cx + bw/2, y: cy + bh/2}, 
                {x: cx - bw/2, y: cy + bh/2}  
            ];
        }

        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })
            .then(stream => {
                video.srcObject = stream;
                video.play();
                streaming = true;
                initDefaultCorners(window.innerWidth, window.innerHeight);
                requestAnimationFrame(mainLoop);
            })
            .catch(err => alert("Erreur caméra : " + err.message));

        function drawCover(source) {
            let cw = canvas.width;
            let ch = canvas.height;
            let sw = source.videoWidth || source.width;
            let sh = source.videoHeight || source.height;
            if (!sw || !sh) return;

            let hRatio = cw / sw;
            let vRatio = ch / sh;
            let ratio = Math.max(hRatio, vRatio);
            let centerShiftX = (cw - sw * ratio) / 2;
            let centerShiftY = (ch - sh * ratio) / 2;

            ctx.drawImage(source, 0, 0, sw, sh, centerShiftX, centerShiftY, sw * ratio, sh * ratio);
        }

        function updateCornerDOM() {
            if (appState !== 'ADJUST_MARTYR') {
                ['sg', 'sd', 'id', 'ig'].forEach(name => {
                    document.getElementById('box-' + name).style.display = 'none';
                });
                return;
            }

            corners.forEach((p, idx) => {
                let screenX = (p.x - canvas.width / 2) * zoomLevel + canvas.width / 2 + panX;
                let screenY = (p.y - canvas.height / 2) * zoomLevel + canvas.height / 2 + panY;
                
                let el = document.getElementById('box-' + cornerNames[idx].toLowerCase());
                if (el) {
                    el.style.display = 'flex';
                    el.style.left = (screenX - 22) + 'px';
                    el.style.top = (screenY - 22) + 'px';
                    if (idx === activeCornerIndex) {
                        el.style.background = '#ff00ff';
                        el.style.color = '#ffffff';
                        el.style.borderColor = '#ffffff';
                    } else {
                        el.style.background = '#ffeb3b';
                        el.style.color = '#000000';
                        el.style.borderColor = '#333333';
                    }
                }
            });
        }

        function mainLoop() {
            if (!streaming) return;
            resizeCanvasToDisplay();

            if (video.readyState >= video.HAVE_CURRENT_DATA) {
                ctx.save();
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                ctx.translate(canvas.width / 2 + panX, canvas.height / 2 + panY);
                ctx.scale(zoomLevel, zoomLevel);
                ctx.translate(-canvas.width / 2, -canvas.height / 2);

                if (appState === 'CAPTURE_MARTYR') {
                    drawCover(video);
                    drawXAxisOnly();
                } else if (appState === 'ADJUST_MARTYR' && martyrImage) {
                    drawCover(martyrImage);
                    drawOverlay();
                } else if (appState === 'PRODUCTION') {
                    drawCover(video);
                    drawOverlay();
                }

                ctx.restore();
                updateCornerDOM();
            }

            requestAnimationFrame(mainLoop);
        }

        function drawXAxisOnly() {
            ctx.strokeStyle = 'red';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(0, canvas.height / 2);
            ctx.lineTo(canvas.width, canvas.height / 2);
            ctx.stroke();
        }

        function drawOverlay() {
            let midLeftY = (corners[0].y + corners[3].y) / 2;
            let midRightY = (corners[1].y + corners[2].y) / 2;

            ctx.strokeStyle = 'red';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(0, (midLeftY + midRightY) / 2);
            ctx.lineTo(canvas.width, (midLeftY + midRightY) / 2);
            ctx.stroke();

            ctx.strokeStyle = appState === 'ADJUST_MARTYR' ? 'cyan' : 'yellow';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(corners[0].x, corners[0].y);
            ctx.lineTo(corners[1].x, corners[1].y);
            ctx.lineTo(corners[2].x, corners[2].y);
            ctx.lineTo(corners[3].x, corners[3].y);
            ctx.closePath();
            ctx.stroke();
        }

        // Permettre de cliquer sur les boîtes HTML des coins pour les sélectionner directement
        ['sg', 'sd', 'id', 'ig'].forEach((name, idx) => {
            document.getElementById('box-' + name).addEventListener('click', () => {
                activeCornerIndex = idx;
                centerDpadBtn.innerText = cornerNames[activeCornerIndex];
            });
        });

        // D-Pad Coins
        document.getElementById('dpad-up').addEventListener('click', () => moveActiveCorner(0, -3));
        document.getElementById('dpad-down').addEventListener('click', () => moveActiveCorner(0, 3));
        document.getElementById('dpad-left').addEventListener('click', () => moveActiveCorner(-3, 0));
        document.getElementById('dpad-right').addEventListener('click', () => moveActiveCorner(3, 0));

        centerDpadBtn.addEventListener('click', () => {
            activeCornerIndex = (activeCornerIndex + 1) % 4;
            centerDpadBtn.innerText = cornerNames[activeCornerIndex];
        });

        function moveActiveCorner(dx, dy) {
            if (appState !== 'ADJUST_MARTYR') return;
            corners[activeCornerIndex].x += dx;
            corners[activeCornerIndex].y += dy;
        }

        // Panoramique (Navigation 4 axes)
        document.getElementById('pan-up').addEventListener('click', () => { panY += 25; });
        document.getElementById('pan-down').addEventListener('click', () => { panY -= 25; });
        document.getElementById('pan-left').addEventListener('click', () => { panX += 25; });
        document.getElementById('pan-right').addEventListener('click', () => { panX -= 25; });

        // Zoom & Échelle
        document.getElementById('zoom-plus').addEventListener('click', () => { zoomLevel = Math.min(zoomLevel + 0.2, 3.0); });
        document.getElementById('zoom-minus').addEventListener('click', () => { 
            zoomLevel = Math.max(zoomLevel - 0.2, 1.0); 
            if (zoomLevel === 1.0) { panX = 0; panY = 0; }
        });

        function scaleCorners(factor) {
            let cx = (corners[0].x + corners[1].x + corners[2].x + corners[3].x) / 4;
            let cy = (corners[0].y + corners[1].y + corners[2].y + corners[3].y) / 4;
            corners.forEach(p => {
                p.x = cx + (p.x - cx) * factor;
                p.y = cy + (p.y - cy) * factor;
            });
        }

        document.getElementById('scale-plus').addEventListener('click', () => scaleCorners(1.03));
        document.getElementById('scale-minus').addEventListener('click', () => scaleCorners(0.97));

        btnAction.addEventListener('click', () => {
            if (appState === 'CAPTURE_MARTYR') {
                let tempCanvas = document.createElement('canvas');
                tempCanvas.width = video.videoWidth || 1280;
                tempCanvas.height = video.videoHeight || 720;
                let tCtx = tempCanvas.getContext('2d');
                tCtx.drawImage(video, 0, 0, tempCanvas.width, tempCanvas.height);
                
                martyrImage = new Image();
                martyrImage.src = tempCanvas.toDataURL();
                martyrImage.onload = () => {
                    appState = 'ADJUST_MARTYR';
                    statusMsg.innerText = "Étape 2 : Ajustez le cadre, touchez les coins ou naviguez avec PAN";
                    btnAction.innerText = "✅ Valider l'étalonnage";
                    controlPanel.style.display = 'flex';
                };
            } else if (appState === 'ADJUST_MARTYR') {
                localStorage.setItem('acuitix_config', JSON.stringify(corners));

                appState = 'PRODUCTION';
                statusMsg.innerText = "🎯 Mode Production actif (Étalonnage mémorisé)";
                btnAction.style.display = 'none';
                controlPanel.style.display = 'none';
                zoomLevel = 1.0;
                panX = 0;
                panY = 0;
                btnLeft.style.display = 'block';
                btnRight.style.display = 'block';
            }
        });

        let lastCapturedWithLayers = null;
        let lastCapturedOriginal = null;

        function handleProductionCapture() {
            let origCanvas = document.createElement('canvas');
            origCanvas.width = video.videoWidth || canvas.width;
            origCanvas.height = video.videoHeight || canvas.height;
            let origCtx = origCanvas.getContext('2d');
            origCtx.drawImage(video, 0, 0, origCanvas.width, origCanvas.height);
            lastCapturedOriginal = origCanvas.toDataURL('image/png');

            let layerCanvas = document.createElement('canvas');
            layerCanvas.width = origCanvas.width;
            layerCanvas.height = origCanvas.height;
            let layerCtx = layerCanvas.getContext('2d');
            layerCtx.drawImage(origCanvas, 0, 0);

            let scaleFactorX = layerCanvas.width / canvas.width;
            let scaleFactorY = layerCanvas.height / canvas.height;

            let midLeftY = (corners[0].y + corners[3].y) / 2;
            let midRightY = (corners[1].y + corners[2].y) / 2;

            layerCtx.strokeStyle = 'red';
            layerCtx.lineWidth = 4 * scaleFactorX;
            layerCtx.beginPath();
            layerCtx.moveTo(0, ((midLeftY + midRightY) / 2) * scaleFactorY);
            layerCtx.lineTo(layerCanvas.width, ((midLeftY + midRightY) / 2) * scaleFactorY);
            layerCtx.stroke();

            layerCtx.strokeStyle = 'yellow';
            layerCtx.lineWidth = 4 * scaleFactorX;
            layerCtx.beginPath();
            layerCtx.moveTo(corners[0].x * scaleFactorX, corners[0].y * scaleFactorY);
            layerCtx.lineTo(corners[1].x * scaleFactorX, corners[1].y * scaleFactorY);
            layerCtx.lineTo(corners[2].x * scaleFactorX, corners[2].y * scaleFactorY);
            layerCtx.lineTo(corners[3].x * scaleFactorX, corners[3].y * scaleFactorY);
            layerCtx.closePath();
            layerCtx.stroke();

            lastCapturedWithLayers = layerCanvas.toDataURL('image/png');

            previewCanvas.width = layerCanvas.width;
            previewCanvas.height = layerCanvas.height;
            let pCtx = previewCanvas.getContext('2d');
            pCtx.drawImage(layerCanvas, 0, 0);
            previewModal.style.display = 'flex';
        }

        btnLeft.addEventListener('click', handleProductionCapture);
        btnRight.addEventListener('click', handleProductionCapture);
        document.getElementById('close-preview').addEventListener('click', () => previewModal.style.display = 'none');

        document.getElementById('dl-with-layers').addEventListener('click', () => {
            let link = document.createElement('a');
            link.download = 'etalon11_prod_calques.png';
            link.href = lastCapturedWithLayers;
            link.click();
        });

        document.getElementById('dl-original').addEventListener('click', () => {
            let link = document.createElement('a');
            link.download = 'etalon11_prod_originale.png';
            link.href = lastCapturedOriginal;
            link.click();
        });

        document.getElementById('share-btn').addEventListener('click', async () => {
            if (navigator.share) {
                try {
                    let blob = await (await fetch(lastCapturedWithLayers)).blob();
                    let file = new File([blob], "etalon11_production.png", { type: "image/png" });
                    await navigator.share({ title: 'Acuitix Optix - Production', files: [file] });
                } catch (err) {
                    console.log("Partage annulé");
                }
            } else {
                alert("Le partage natif n'est pas pris en charge.");
            }
        });
    </script>
</body>
</html>
